<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halden Employee Onboarding</title>
  <meta name="description" content="Interactive employee onboarding course built on the CONNECT™ methodology.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
/* Halden Employee Onboarding
   Layout: header with points chip; lesson sidebar | lesson column (+ optional CONNECT lens); sticky player bar.
   Type: Roboto Slab for headings, Roboto for body, Roboto Mono for labels. */

:root {
  --bg: #f7f5f6;
  --surface: #ffffff;
  --ink: #1d1a1c;
  --muted: #625c60;
  --line: #e7e2e4;
  --vino: #b01857;
  --fushia: #ff257d;
  --tint: #fbeef3;
  --rose: #ffd3e5;
  --hero: #8f1347;
  --hero-ink: #ffffff;
  --good: #5f8f4c;
  --good-ink: #2f4a24;
  --good-tint: #eef5ea;
  --bad: #b3261e;
  --bad-tint: #fbeceb;
  --gold: #f2c846;
  --gold-ink: #5c4705;
  --gold-tint: #fdf6de;
  --on-accent: #ffffff;
  --scrim: rgba(29, 26, 28, .5);
  --shadow: 0 1px 2px rgba(29, 26, 28, .06), 0 8px 24px rgba(29, 26, 28, .06);
  --slab: 'Roboto Slab', Georgia, 'Times New Roman', serif;
  --font: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141113; --surface: #1d191b; --ink: #f3edf0; --muted: #a9a0a5; --line: #352e32;
    --vino: #ff92be; --fushia: #ff66a4; --tint: #2b1820; --rose: #4a2233; --hero: #4f0d29; --hero-ink: #ffffff;
    --good: #8fbf7a; --good-ink: #cfe5c4; --good-tint: #1f2a1b; --bad: #f2a29c; --bad-tint: #2e1716;
    --gold: #f2c846; --gold-ink: #f5e2a3; --gold-tint: #2c2612; --on-accent: #1d1a1c; --scrim: rgba(0, 0, 0, .65);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141113; --surface: #1d191b; --ink: #f3edf0; --muted: #a9a0a5; --line: #352e32;
  --vino: #ff92be; --fushia: #ff66a4; --tint: #2b1820; --rose: #4a2233; --hero: #4f0d29; --hero-ink: #ffffff;
  --good: #8fbf7a; --good-ink: #cfe5c4; --good-tint: #1f2a1b; --bad: #f2a29c; --bad-tint: #2e1716;
  --gold: #f2c846; --gold-ink: #f5e2a3; --gold-tint: #2c2612; --on-accent: #1d1a1c; --scrim: rgba(0, 0, 0, .65);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
:root.large { --fs: 18.5px; }

/* Base */
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--slab); text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--fushia); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { position: fixed; left: 16px; top: 16px; width: auto; height: auto; clip: auto; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: 6px; }

.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.ic.fill { fill: currentColor; stroke: none; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand b { font-family: var(--slab); font-weight: 500; white-space: nowrap; }
.brand-sub { color: var(--muted); font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark { width: 22px; height: 22px; border: 1.5px solid var(--vino); border-radius: 50%; display: grid; place-items: center; flex: none; }
.mark::after { content: ""; width: 8px; height: 8px; background: var(--vino); border-radius: 50%; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.tool { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: .8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tool:hover { border-color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.switch { width: 26px; height: 14px; border-radius: 7px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left .2s; }
.tool[aria-pressed="true"] .switch { background: var(--vino); }
.tool[aria-pressed="true"] .switch::after { left: 14px; background: var(--on-accent); }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 36px; height: 36px; display: none; place-items: center; cursor: pointer; flex: none; }
.xp-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; font-size: .8rem; white-space: nowrap; }
.xp-chip:hover { border-color: var(--vino); }
.xp-chip .bolt { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #3b2f05; display: grid; place-items: center; }
.xp-chip .bolt .ic { width: 13px; height: 13px; }
.xp-chip b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.xp-chip .lv { color: var(--muted); }
.xp-chip .bdg { display: inline-flex; align-items: center; gap: 4px; color: var(--vino); font-family: var(--mono); }
.xp-chip.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.08); } }
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--vino); transition: width .4s ease; }

/* Shell */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.main { min-width: 0; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.cover-on .shell { grid-template-columns: minmax(0, 1fr); }
body.cover-on .side, body.cover-on .player, body.cover-on .chain-scroll, body.cover-on .lens-panel { display: none; }
body.cover-on .main { padding-left: 0; padding-right: 0; }

/* Sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); height: calc(100vh - 60px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 24px 16px 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 20px; }
.side-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 0 8px; }
.side-head h2 { font-weight: 400; font-size: 1.1rem; line-height: 1.3; }
.side-head p { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
.ring { --p: 0; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--vino) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; font-family: var(--mono); font-size: .72rem; font-variant-numeric: tabular-nums; }
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lsn { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) 20px; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 8px; cursor: pointer; }
.lsn:hover:not([aria-disabled="true"]) { background: var(--tint); }
.lsn:focus-visible { outline: 2px solid var(--fushia); }
.lsn[aria-disabled="true"] { cursor: default; opacity: .55; }
.lsn .tile { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.lsn .t { display: grid; min-width: 0; }
.lsn .t small { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lsn .t span { font-size: .92rem; line-height: 1.3; }
.lsn .st { color: var(--muted); display: grid; place-items: center; }
.lessons li.current .lsn { background: var(--tint); }
.lessons li.current .tile { background: var(--vino); color: var(--on-accent); }
.lessons li.current .t span { color: var(--vino); font-weight: 500; }
.lessons li.done .st { color: var(--good); }
.lessons li.done .tile { color: var(--vino); }
.side-badges { padding: 16px 8px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.side-badges .row { gap: 6px; }
.mini-badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--line); border: 1px dashed var(--line); }
.mini-badge.on { background: var(--hero); color: var(--gold); border: 0; }
.mini-badge .ic { width: 15px; height: 15px; }
.scrim { display: none; }

/* Chain */
.chain-scroll { overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.chain-scroll::-webkit-scrollbar { display: none; }
.chain { display: flex; list-style: none; margin: 0 auto; padding: 10px 0; min-width: 720px; max-width: 1080px; }
.chain li { flex: 1; display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--muted); white-space: nowrap; }
.chain li + li::before { content: "→"; color: var(--line); padding: 0 6px; }
.chain li .k { font-family: var(--mono); font-size: .64rem; letter-spacing: .06em; }
.chain li.on { color: var(--vino); font-weight: 500; }
.chain li.past { color: var(--ink); }

/* Content */
.content { display: grid; grid-template-columns: minmax(0, 760px); justify-content: center; gap: 48px; padding-block: 36px 32px; align-items: start; }
body.lens .content { grid-template-columns: minmax(0, 720px) 280px; }
.lesson-col { min-width: 0; }
.content { flex: 1 0 auto; }
.lesson { display: grid; gap: 28px; min-width: 0; }
.lesson:focus { outline: none; }

.lhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.lhead .tile { width: 44px; height: 44px; border-radius: 10px; background: var(--tint); color: var(--vino); display: grid; place-items: center; }
.lhead .tile .ic { width: 22px; height: 22px; }
.lhead small { display: block; font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--vino); }
.lhead b { font-family: var(--slab); font-weight: 400; font-size: 1.05rem; }
.lhead .steps { display: flex; gap: 4px; }
.lhead .steps i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.lhead .steps i.d { background: var(--muted); }
.lhead .steps i.c { background: var(--vino); }

.eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--vino); }
h1 { font-weight: 300; font-size: clamp(1.8rem, 3.6vw, 2.5rem); line-height: 1.18; letter-spacing: -.01em; }
h2 { font-weight: 500; font-size: 1.15rem; line-height: 1.35; }
h3 { font-weight: 500; font-size: 1rem; }
.head { display: grid; gap: 12px; }
.lead { font-size: 1.1em; font-weight: 300; color: var(--muted); max-width: 62ch; }
.body { max-width: 65ch; display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.footnote { font-size: .75rem; color: var(--muted); }
.mono-lab { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.counter { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 18px; min-width: 0; box-shadow: var(--shadow); }
.block.flat { box-shadow: none; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.quote { font-family: var(--slab); font-size: 1.5rem; font-weight: 300; line-height: 1.35; max-width: 32ch; }
.callout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 18px 20px; border-radius: 10px; background: var(--tint); align-items: start; }
.callout .ic { width: 22px; height: 22px; color: var(--vino); }

/* Buttons */
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 11px 22px; cursor: pointer; font-weight: 500; font-size: .9rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover:not([disabled]) { background: var(--vino); border-color: var(--vino); color: var(--on-accent); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover:not([disabled]) { border-color: var(--ink); background: transparent; color: var(--ink); }
.btn.accent { background: var(--vino); border-color: var(--vino); color: var(--on-accent); }
.btn.big { padding: 14px 28px; font-size: 1rem; }
.chip { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--vino); color: var(--vino); }

/* Player bar */
.player { position: sticky; bottom: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
body.lens .player { max-width: 1048px; }
.player .hint { font-size: .8rem; color: var(--muted); flex: 1; text-align: center; min-width: 0; }
.foot { max-width: 1048px; width: 100%; margin: 0 auto; padding-block: 18px 28px; font-size: .75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
body.cover-on .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cover */
.cover-hero { background: var(--hero); color: var(--hero-ink); position: relative; overflow: hidden; }
.cover-hero::before, .cover-hero::after { content: ""; position: absolute; border: 1px solid rgba(255, 255, 255, .16); border-radius: 50%; }
.cover-hero::before { width: 520px; height: 520px; right: -140px; top: -180px; }
.cover-hero::after { width: 320px; height: 320px; right: -40px; top: -80px; }
.cover-in { max-width: 1080px; margin: 0 auto; padding: 72px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; position: relative; z-index: 1; }
.cover-in .eyebrow { color: var(--rose); }
.cover-in h1 { font-weight: 300; font-size: clamp(2.2rem, 5.4vw, 3.6rem); max-width: 16ch; line-height: 1.08; }
.cover-in p { max-width: 56ch; font-weight: 300; font-size: 1.1rem; opacity: .9; }
.cover-meta { display: flex; flex-wrap: wrap; gap: 22px; font-size: .85rem; opacity: .9; }
.cover-meta span { display: inline-flex; align-items: center; gap: 8px; }
.cover-in .btn { justify-self: start; background: var(--hero-ink); color: #3a0a1e; border-color: var(--hero-ink); }
.cover-in .btn:hover { background: var(--rose); border-color: var(--rose); color: #3a0a1e; }
.cover-in .btn.over { background: transparent; color: var(--hero-ink); border-color: rgba(255, 255, 255, .55); }
.cover-in .btn.over:hover { background: rgba(255, 255, 255, .12); border-color: var(--hero-ink); color: var(--hero-ink); }
body.cover-on #t-restart { display: none; }
.dialog .icon-big { width: 72px; height: 72px; border-radius: 50%; background: var(--tint); color: var(--vino); display: grid; place-items: center; }
.dialog .icon-big .ic { width: 32px; height: 32px; }
.cover-body { max-width: 1080px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; }
.cover-list { list-style: none; margin: 0; padding: 0; display: grid; }
.cover-list li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.cover-list .tile { width: 44px; height: 44px; border-radius: 10px; background: var(--tint); color: var(--vino); display: grid; place-items: center; }
.cover-list small { display: block; font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cover-list b { font-family: var(--slab); font-weight: 400; }
.cover-list .min { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.cover-aside { display: grid; gap: 16px; align-content: start; }
.how { display: grid; gap: 14px; }
.how div { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; font-size: .9rem; }
.how .ic { width: 20px; height: 20px; color: var(--vino); margin-top: 2px; }
.how b { font-weight: 500; display: block; }

/* Gap tiles */
.gap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gap > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 4px; align-content: start; }
.gap .top-l { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.gap .num { font-family: var(--slab); font-size: 2.1rem; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
.gap .target { border-color: var(--vino); }
.gap .target .num, .gap .target .top-l { color: var(--vino); }

/* Choice buttons */
.choices { display: grid; gap: 10px; }
.choices.cols { grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
.choice { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; transition: border-color .15s, background-color .15s; }
.choice > .ic { color: var(--muted); width: 22px; height: 22px; }
.choice .txt { display: grid; gap: 2px; }
.choice b { font-weight: 500; }
.choice span { font-size: .86rem; color: var(--muted); }
.choice:hover:not([disabled]) { border-color: var(--muted); }
.choice[aria-pressed="true"], .choice[aria-checked="true"] { border-color: var(--vino); background: var(--tint); }
.choice[aria-pressed="true"] > .ic { color: var(--vino); }
.choice[disabled] { cursor: default; }
.choice.correct { border-color: var(--good); background: var(--good-tint); }
.choice.wrong { border-color: var(--bad); background: var(--bad-tint); }
.choice.dim { opacity: .55; }
.choice.big { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 20px 14px; gap: 8px; }
.choice.big > .ic { width: 30px; height: 30px; }

/* Quiz (Articulate-style) */
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qdots { display: flex; gap: 6px; }
.qdots i { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.qdots i.ok { background: var(--good); }
.qdots i.no { background: var(--bad); }
.qdots i.cur { background: var(--vino); }
.stats { display: flex; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .75rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.stat.flame { color: var(--vino); }
.stat.flame.hot { background: var(--vino); color: var(--on-accent); border-color: var(--vino); }
.stat.pts .ic { color: var(--gold-ink); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.qcard .qhead { padding: 28px 28px 0; display: grid; gap: 10px; }
.qcard .qhead h2 { font-size: 1.35rem; font-weight: 400; }
.qcard .qbody { padding: 22px 28px 28px; display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background-color .15s; }
.opt:hover:not([disabled]) { border-color: var(--muted); }
.opt .lt { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.opt[aria-checked="true"] { border-color: var(--vino); background: var(--tint); }
.opt[aria-checked="true"] .lt { background: var(--vino); border-color: var(--vino); color: var(--on-accent); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-tint); }
.opt.correct .lt { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.opt.wrong { border-color: var(--bad); background: var(--bad-tint); }
.opt.wrong .lt { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt .mk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
.opt.correct .mk { color: var(--good-ink); }
.opt.wrong .mk { color: var(--bad); }
.qfoot { padding: 0 28px 28px; display: flex; justify-content: flex-end; }
.fb { margin: 0 28px 28px; border-radius: 10px; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: start; }
.fb .ic { width: 28px; height: 28px; }
.fb.ok { background: var(--good-tint); color: var(--good-ink); }
.fb.no { background: var(--bad-tint); color: var(--ink); }
.fb.no .ic { color: var(--bad); }
.fb b { font-family: var(--slab); font-weight: 500; font-size: 1.1rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fb .xp { font-family: var(--mono); font-size: .75rem; font-weight: 500; background: var(--gold); color: #3b2f05; padding: 2px 8px; border-radius: 999px; }
.fb .acts { grid-column: 2; display: flex; justify-content: flex-end; margin-top: 8px; }

.result { text-align: center; display: grid; justify-items: center; gap: 16px; padding: 36px 28px; }
.score-ring { --p: 0; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--vino) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.score-ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--surface); }
.score-ring div { position: relative; display: grid; }
.score-ring b { font-family: var(--slab); font-weight: 300; font-size: 2.2rem; line-height: 1; }
.score-ring small { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
.stars { display: flex; gap: 6px; }
.stars .ic { width: 30px; height: 30px; color: var(--line); }
.stars .ic.on { color: var(--gold); }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; width: 100%; }
.review li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; font-size: .88rem; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.review .ic.ok { color: var(--good); }
.review .ic.no { color: var(--bad); }

/* Rating */
.rate-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.rate-row:last-child { border-bottom: 0; }
.rate-row > .ic { color: var(--vino); width: 20px; height: 20px; }
.scale { display: flex; gap: 4px; }
.scale button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: .8rem; }
.scale button:hover { border-color: var(--muted); }
.scale button[aria-checked="true"] { background: var(--vino); border-color: var(--vino); color: var(--on-accent); }
.scale-legend { display: flex; justify-content: space-between; gap: 12px; font-size: .72rem; color: var(--muted); font-family: var(--mono); }

/* Path */
.path-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: start; }
.path-row:last-child { border-bottom: 0; }
.path-row .tile { width: 40px; height: 40px; border-radius: 10px; background: var(--tint); color: var(--vino); display: grid; place-items: center; grid-row: span 2; }
.path-row b { font-family: var(--slab); font-weight: 400; }
.path-row .min { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.trace { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); }
.trace span::before { content: "↳ "; color: var(--line); }
.tag { display: inline-block; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 3px; white-space: nowrap; }
.tag.focus { background: var(--vino); color: var(--on-accent); }
.tag.refresh { border: 1px solid var(--line); color: var(--muted); }

/* Flip cards */
.flips { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 14px; }
.flip { all: unset; box-sizing: border-box; cursor: pointer; perspective: 1200px; display: block; min-width: 0; height: 100%; }
.flip:focus-visible { outline: 2px solid var(--fushia); outline-offset: 3px; border-radius: 12px; }
.flip-in { display: grid; height: 100%; transition: transform .6s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; min-height: 15.5rem; }
.flip[aria-pressed="true"] .flip-in { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; padding: 22px; display: grid; align-content: start; gap: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.face.front { align-content: space-between; }
.face.front .ic.big { width: 40px; height: 40px; color: var(--vino); }
.face.front h3 { font-weight: 400; font-size: 1.3rem; line-height: 1.25; }
.face.front .hintline { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--vino); display: flex; align-items: center; gap: 6px; }
.face.back { transform: rotateY(180deg); background: var(--hero); color: var(--hero-ink); border-color: var(--hero); font-size: .88rem; gap: 12px; }
.face.back h4 { margin: 0; font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #ffc2da; }
.face.back ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; margin-bottom: -1px; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--vino); }
.tab[aria-selected="true"] .ic { color: var(--vino); }
.tab .seen { width: 6px; height: 6px; border-radius: 50%; background: var(--vino); }
.tabpanel { padding-top: 22px; display: grid; gap: 14px; }
.tabpanel ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 12px 16px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); font-family: var(--mono); font-size: .7rem; padding-top: 3px; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 8px; align-items: flex-start; }
.kv dt .ic { color: var(--vino); width: 16px; height: 16px; }
.kv dd { margin: 0; }
.yours { display: inline-block; font-family: var(--mono); font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; color: var(--on-accent); background: var(--vino); border-radius: 999px; padding: 1px 7px; }

/* Process (timeline) */
.process { display: grid; gap: 22px; }
.pdots { display: flex; position: relative; }
.pdots::before { content: ""; position: absolute; left: 20px; right: 20px; top: 20px; height: 1px; background: var(--line); }
.pdots button { all: unset; box-sizing: border-box; flex: 1; display: grid; justify-items: center; gap: 6px; cursor: pointer; position: relative; min-width: 0; }
.pdots button:focus-visible { outline: 2px solid var(--fushia); border-radius: 6px; }
.pdots .pt { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); position: relative; z-index: 1; }
.pdots .yr { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.pdots button.seen .pt { border-color: var(--vino); color: var(--vino); }
.pdots button[aria-selected="true"] .pt { background: var(--vino); border-color: var(--vino); color: var(--on-accent); }
.pdots button[aria-selected="true"] .yr { color: var(--vino); font-weight: 500; }
.pstep { display: grid; gap: 10px; }
.pstep h2 { font-weight: 300; font-size: 1.5rem; }
.pstep .so { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; font-size: .9rem; padding: 14px 16px; background: var(--tint); border-radius: 8px; }
.pstep .so .ic { color: var(--vino); }
.pnav { display: flex; justify-content: space-between; gap: 10px; }

/* Bars */
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) 3rem; gap: 14px; align-items: center; font-size: .88rem; }
.bar-row > span:first-child { display: flex; gap: 8px; align-items: center; }
.bar-track { height: 12px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-track i { display: block; height: 100%; background: var(--vino); border-radius: 3px; }
.bar-row.dim .bar-track i { background: var(--muted); }
.bar-row .v { font-family: var(--mono); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }

/* Scenario */
.scene { display: grid; gap: 18px; }
.speaker { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; font-family: var(--slab); font-size: 1rem; }
.bubble { background: var(--bg); border-radius: 4px 14px 14px 14px; padding: 14px 18px; display: grid; gap: 6px; }
.bubble small { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.outcome { border-radius: 10px; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; }
.outcome .ic { width: 26px; height: 26px; }
.outcome.good { background: var(--good-tint); color: var(--good-ink); }
.outcome.mid { background: var(--gold-tint); color: var(--gold-ink); }
.outcome b { font-family: var(--slab); font-weight: 500; }

/* Match + sort */
.legend-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.legend-chips span { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--bg); }
.legend-chips .ic { color: var(--vino); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: 10px 20px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.mrow:last-of-type { border-bottom: 0; }
.mrow .why { grid-column: 1 / -1; font-size: .84rem; display: flex; gap: 8px; align-items: flex-start; }
.mrow .why.ok { color: var(--good-ink); }
.mrow .why.no { color: var(--bad); }
select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; }
select:focus { border-color: var(--vino); outline: none; box-shadow: 0 0 0 3px var(--tint); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; font-size: .78rem; cursor: pointer; border-right: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not([disabled]) { background: var(--tint); }
.seg button[disabled] { cursor: default; }
.seg button.correct { background: var(--good-tint); color: var(--good-ink); font-weight: 500; }
.seg button.picked { background: var(--bad-tint); color: var(--bad); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .why { grid-column: 1 / -1; font-size: .84rem; color: var(--muted); }

/* Email hotspot */
.mail { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.mail-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
.mail-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: .88rem; }
.mail-head .r { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 8px; }
.mail-head .r > span:first-child { color: var(--muted); font-family: var(--mono); font-size: .7rem; padding-top: 2px; }
.mail-body { padding: 20px; display: grid; gap: 12px; font-size: .92rem; }
.hs { all: unset; cursor: pointer; border-radius: 3px; padding: 0 2px; overflow-wrap: anywhere; }
.hs:hover { background: var(--tint); }
.hs:focus-visible { outline: 2px solid var(--fushia); }
.hs.found { background: var(--rose); color: var(--ink); }
.hs.miss { text-decoration: line-through; text-decoration-color: var(--muted); }
.hs sup { font-family: var(--mono); font-size: .62rem; color: var(--vino); margin-left: 2px; }
.fake-link { color: var(--vino); text-decoration: underline; }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flags li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 8px; font-size: .88rem; }
.flags li b { font-family: var(--mono); font-size: .72rem; color: var(--vino); padding-top: 2px; }
.status { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.status.pending { background: var(--gold-tint); color: var(--gold-ink); }
.status.ok { background: var(--good-tint); color: var(--good-ink); }

/* Checklist */
.check { display: grid; grid-template-columns: auto 36px minmax(0, 1fr); gap: 2px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--vino); }
.check .tile { width: 36px; height: 36px; border-radius: 8px; background: var(--tint); color: var(--vino); display: grid; place-items: center; }
.check span { display: grid; }
.check b { font-weight: 500; font-size: .95rem; }
.check small { color: var(--muted); font-size: .84rem; }

/* Inputs */
label.field { display: grid; gap: 6px; font-size: .88rem; }
label.field > span { color: var(--muted); }
input[type="text"], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; line-height: 1.5; }
input[type="text"]:focus, textarea:focus { border-color: var(--vino); outline: none; box-shadow: 0 0 0 3px var(--tint); }
textarea { resize: vertical; min-height: 5em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ai { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ai-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: var(--tint); font-size: .82rem; flex-wrap: wrap; }
.ai-head > span:first-child { display: inline-flex; gap: 8px; align-items: center; }
.ai-head b { font-weight: 500; }
.ai-head .ic { color: var(--vino); }
.ai-body { padding: 16px; display: grid; gap: 12px; background: var(--surface); }
.ai-body textarea { font-family: var(--mono); font-size: .82rem; min-height: 12em; }

/* Measurement */
.loop-scroll { overflow-x: auto; }
.loop { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 680px; }
.loop > div { padding: 14px 12px; display: grid; gap: 6px; align-content: start; border-right: 1px solid var(--line); background: var(--surface); }
.loop > div:last-child { border-right: 0; }
.loop .lab { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--vino); display: flex; gap: 6px; align-items: center; }
.loop p { font-size: .8rem; line-height: 1.45; }
.dumb { display: grid; gap: 14px; }
.dumb-row { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) 3rem; gap: 16px; align-items: center; font-size: .86rem; }
.dumb-track { position: relative; height: 22px; }
.dumb-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.dumb-track .sg { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--vino); }
.dumb-track .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; }
.dumb-track .dot.b { background: var(--surface); border: 2px solid var(--muted); }
.dumb-track .dot.a { background: var(--vino); }
.delta { font-family: var(--mono); font-size: .8rem; text-align: right; color: var(--vino); font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) 3rem; gap: 16px; }
.axis div { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .66rem; color: var(--muted); }
.legend { display: flex; gap: 18px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* Journey map */
.jmap-scroll { overflow-x: auto; }
.jmap { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 620px; }
.jmap th { text-align: left; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
.jmap td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.jmap tr:last-child td { border-bottom: 0; }
.jmap .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .8rem; }
.jmap .mname { display: flex; gap: 8px; align-items: center; }
.jmap .mname .ic { color: var(--vino); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.p1 { background: var(--good-tint); color: var(--good-ink); }
.pill.p2 { background: var(--tint); color: var(--ink); }
.pill.p3 { background: var(--gold-tint); color: var(--gold-ink); }
.pill.p0 { border: 1px solid var(--line); color: var(--muted); }
.mini-stars { display: inline-flex; gap: 2px; }
.mini-stars .ic { width: 14px; height: 14px; color: var(--line); }
.mini-stars .ic.on { color: var(--gold); }
.tbar { position: relative; height: 8px; background: var(--line); border-radius: 2px; width: 100%; min-width: 70px; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--vino); border-radius: 2px; }
.tbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 16px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.badge .medal { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--line); border: 1.5px dashed var(--line); }
.badge .medal .ic { width: 26px; height: 26px; }
.badge.on .medal { background: var(--hero); color: var(--gold); border: 3px solid var(--gold); }
.badge b { font-family: var(--slab); font-weight: 500; font-size: .88rem; line-height: 1.25; }
.badge small { font-size: .74rem; color: var(--muted); line-height: 1.35; }
.badge:not(.on) b { color: var(--muted); }
.level { display: grid; gap: 8px; }
.level-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.level-top b { font-family: var(--slab); font-weight: 400; font-size: 1.3rem; }
.level-top span { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.level-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.level-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--vino), var(--fushia)); border-radius: 4px; }
.levels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .64rem; color: var(--muted); }

/* Certificate */
.cert { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 44px 32px; display: grid; gap: 14px; text-align: center; justify-items: center; position: relative; box-shadow: var(--shadow); }
.cert::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--vino); border-radius: 6px; pointer-events: none; }
.cert .seal { width: 64px; height: 64px; border-radius: 50%; background: var(--hero); color: var(--gold); display: grid; place-items: center; border: 3px solid var(--gold); }
.cert .seal .ic { width: 30px; height: 30px; }
.cert .who { font-family: var(--slab); font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 300; }
.cert .line { width: 48px; height: 1px; background: var(--vino); }
.cert dl { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; margin: 8px 0 0; }
.cert dt { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.cert dd { margin: 0; font-family: var(--mono); font-size: .82rem; }

/* Lens */
.lens-panel { display: none; }
body.lens .lens-panel { display: block; }
.lens-card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); border-left: 2px solid var(--vino); padding: 4px 0 4px 20px; display: grid; gap: 16px; }
.lens-card .eyebrow { display: flex; gap: 6px; align-items: center; }
.lens-card h3 { font-weight: 400; font-size: 1.2rem; }
.lens-item { display: grid; gap: 4px; }
.lens-item dt { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lens-item dd { margin: 0; font-size: .85rem; line-height: 1.5; }
.lens-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.lens-tags span { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.lens-tags span.on { border-color: var(--vino); color: var(--vino); }

/* Toasts + layers */
.toasts { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .85rem; box-shadow: var(--shadow); animation: toast 2.4s ease forwards; }
.toast .bolt { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #3b2f05; display: grid; place-items: center; }
.toast .bolt .ic { width: 12px; height: 12px; }
.toast b { font-family: var(--mono); font-weight: 500; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 12%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
.layer { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 14px; max-width: 460px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 24px 64px rgba(0, 0, 0, .3); padding: 32px; display: grid; gap: 16px; animation: pop .35s cubic-bezier(.2, .8, .2, 1.2); }
.dialog.wide { max-width: 760px; }
.dialog.center { text-align: center; justify-items: center; }
.dialog-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dialog h2 { font-weight: 400; font-size: 1.5rem; }
.dialog .medal-big { width: 96px; height: 96px; border-radius: 50%; background: var(--hero); color: var(--gold); display: grid; place-items: center; border: 4px solid var(--gold); }
.dialog .medal-big .ic { width: 44px; height: 44px; }
.x-btn { border: 1px solid var(--line); background: none; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

.fb, .result, .outcome, .callout { scroll-margin-bottom: 120px; scroll-margin-top: 90px; }
.fade { animation: fade .4s ease both; }
@keyframes fade { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade, .dialog, .toast, .xp-chip.bump { animation: none; }

  @keyframes toast-still { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
  .flip-in { transition: none; }
  * { transition: none !important; }
}

/* Responsive */
@media (max-width: 1240px) {
  body.lens .content { grid-template-columns: minmax(0, 760px); }
  body.lens .lens-panel { order: -1; }
  .lens-card { position: static; border-left: 0; border-top: 2px solid var(--vino); border-bottom: 1px solid var(--line); padding: 16px 0; }
  body.lens .player { max-width: 760px; }
}

    transform: translateX(-105%); transition: transform .25s ease; visibility: hidden; }

  body.menu .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: var(--scrim); }

}

  .mrow, .srow { grid-template-columns: minmax(0, 1fr); }
  .dumb-row, .axis { grid-template-columns: minmax(0, 1fr) 3rem; }
  .dumb-row > :first-child { grid-column: 1 / -1; }
  .axis > :first-child { display: none; }

}

      case 'sort': return s.items.every((_, i) => a && a[i] != null);
      case 'hotspot': return !!(a && a.done);
      case 'checklist': return true;
      case 'pulse': return S.pulse[MODULES[s.mi].id] != null;

    scenario: s => {
      const a = S.a[s.id];
      const speaker = s.who ? `<div class="speaker"><span class="avatar" aria-hidden="true">${s.who[0]}</span><div class="bubble"><small>${ic(s.channel[0])} ${s.who[1]} · ${s.channel[1]}</small><p>${s.text}</p></div></div>`
        : `<div class="callout">${ic(s.channel[0])}<div><span class="mono-lab">${s.channel[1]}</span><p>${s.text}</p></div></div>`;
      return `<div class="head"><h1>What would you do?</h1><p class="lead">Choose as you really would. The best choice on your first try earns 100 XP.</p></div>
        <div class="block scene">${speaker}<h2>${s.q}</h2>
        <div class="choices">${s.opts.map((o, i) => `<button class="choice ${a === i ? (o.tone === 'good' ? 'correct' : 'wrong') : a != null ? 'dim' : ''}" data-pick="${i}" ${a != null ? 'disabled' : ''}>${ic(a === i ? (o.tone === 'good' ? 'check-circle' : 'alert') : 'chevron-right')}<span class="txt"><b>${o.t}</b></span></button>`).join('')}</div>
        ${a != null ? `<div class="outcome ${s.opts[a].tone} fade" role="status">${ic(s.opts[a].tone === 'good' ? 'check-circle' : 'alert')}<div><b>What happens</b><p>${s.opts[a].c}</p><p class="small" style="margin-top:6px">${s.opts[a].f}</p></div></div><div><button class="btn ghost" data-retry>${ic('rotate')} Try another choice</button></div>` : ''}</div>`;
    },
    mcq: s => renderQuiz(s),
    match: s => {
      const a = S.a[s.id] || { sel: {}, checked: false, first: null };
      return head(s) + `<div class="legend-chips">${s.options.map((o, j) => `<span>${ic(s.optIcons[j])}${o}</span>`).join('')}</div>
      <div class="block" style="gap:0">${s.items.map((it, i) => {
        const v = a.sel[i]; const ok = v === it.a;
        return `<div class="mrow"><label for="mt-${s.id}-${i}">${it.t}</label>
          <select id="mt-${s.id}-${i}" data-m="${i}"><option value="">Choose…</option>${s.options.map((o, j) => `<option value="${j}" ${v === j ? 'selected' : ''}>${o}</option>`).join('')}</select>
          ${a.checked ? `<p class="why ${ok ? 'ok' : 'no'}">${ic(ok ? 'check-circle' : 'x-circle')}<span>${ok ? it.why : 'Not quite. Change your answer and submit again.'}</span></p>` : ''}</div>`;
      }).join('')}</div>
      <div class="row"><button class="btn" data-check ${s.items.every((_, i) => a.sel[i] != null) ? '' : 'disabled'}>${ic('check')} Submit</button>
      ${a.checked ? `<span class="small muted" role="status">${s.items.filter((it, i) => a.sel[i] === it.a).length} of ${s.items.length} correct</span>` : ''}</div>`;
    },
    sort: s => {
      const a = S.a[s.id] || {};
      return head(s) + `<div class="block" style="gap:0">${s.items.map((it, i) => {
        const v = a[i];
        return `<div class="srow"><span>${it.t}</span><div class="seg" role="group" aria-label="${esc(it.t)}">${s.buckets.map((b, j) => `<button data-s="${i}" data-o="${j}" ${v != null ? 'disabled' : ''} class="${v == null ? '' : j === it.a ? 'correct' : j === v ? 'picked' : ''}">${ic(s.bucketIcons[j])}${b}</button>`).join('')}</div>
          ${v != null ? `<p class="why fade">${v === it.a ? 'Correct. ' : `Best answer: ${s.buckets[it.a]}. `}${it.why}</p>` : ''}</div>`;
      }).join('')}</div><p class="counter">${s.items.filter((it, i) => a[i] === it.a).length} of ${s.items.length} sorted correctly · ${s.items.filter((_, i) => a[i] == null).length} remaining</p>`;
    },
    hotspot: s => {
      const a = S.a[s.id] || { hit: [], ok: [], revealed: false, done: false };
      const P = s.parts, flags = Object.keys(P).filter(k => P[k].flag);
      const num = k => flags.indexOf(k) + 1;
      const seg = k => { const p = P[k], hit = a.hit.includes(k) || (a.revealed && p.flag), ok = a.ok.includes(k); return `<button class="hs ${hit ? 'found' : ''} ${ok ? 'miss' : ''}" data-hs="${k}">${p.t}${hit ? `<sup>${num(k)}</sup>` : ''}</button>`; };
      const found = flags.filter(k => a.hit.includes(k)), shown = a.revealed ? flags : found;
      return head(s) + `<div class="mail" aria-label="Simulated email"><div class="mail-bar">${ic('mail')} Inbox · 1 new message</div>
        <div class="mail-head"><div class="r"><span>FROM</span><span>${seg('from')}</span></div><div class="r"><span>TO</span><span>you@halden.com</span></div><div class="r"><span>SUBJECT</span><span>${seg('subj')}</span></div></div>
        <div class="mail-body"><p>${seg('greet')}</p><p>${seg('pre')}</p><p>Confirm your login and bank details here: ${seg('link')}</p><p>${seg('cred')}</p><p>${seg('sign')}</p></div></div>
        ${a.lastOk ? `<div class="callout fade" role="status">${ic('info')}<p>${P[a.lastOk].ok}</p></div>` : ''}
        <div class="block"><div class="row" style="justify-content:space-between"><h2>${ic('flag')} Red flags</h2><span class="counter" role="status">${found.length} of ${flags.length} found${a.revealed ? ' · rest revealed' : ''}</span></div>
        ${shown.length ? `<ol class="flags">${flags.filter(k => shown.includes(k)).map(k => `<li><b>${num(k)}</b><span>${P[k].flag}</span></li>`).join('')}</ol>` : '<p class="small muted">Nothing found yet. Look closely at the sender, the subject and the link.</p>'}
        <div class="row">${!a.revealed && found.length < flags.length ? `<button class="btn ghost" data-reveal>${ic('eye')} Reveal the rest</button>` : ''}
        ${a.done ? `<span class="status ok">${ic('check')} Reported</span>` : `<button class="btn" data-report ${found.length === flags.length || a.revealed ? '' : 'disabled'}>${ic('alert')} Report phishing</button>`}</div>
        ${a.done ? `<div class="outcome good fade">${ic('shield-check')}<div><b>Reported</b><p>At work, the Report button sends the email to Security and removes it from everyone's inbox. It takes two clicks.</p></div></div>` : ''}</div>`;
    },
    checklist: s => {
      const a = S.a[s.id] || [], items = val(s.items);
      return head(s) + `<div class="block" style="gap:0">${items.map((it, i) => `<label class="check"><input type="checkbox" id="ck-${s.id}-${i}" data-ck="${i}" ${a.includes(i) ? 'checked' : ''}><span class="tile" aria-hidden="true">${ic(it.icon)}</span><span><b>${esc(it.t)}</b><small>${esc(it.d)}</small></span></label>`).join('')}</div>
        <p class="counter">${a.length} of ${items.length} done · you can continue anytime</p>`;
    },
    pulse: s => {
      const m = MODULES[s.mi], p = S.pulse[m.id];
      return `<div class="head"><h1>How did “${m.name}” feel?</h1><p class="lead">One tap, worth 20 XP. Your answer goes straight to the people who improve this course.</p></div>
        <div class="choices cols" role="group" aria-label="Lesson clarity">${PULSE.map(([icn, t], i) => `<button class="choice big" data-pulse="${i + 1}" aria-pressed="${!!(p && p.v === i + 1)}">${ic(icn)}<span class="txt"><b>${t}</b></span></button>`).join('')}</div>
        <label class="field"><span>Anything we should improve? (optional)</span><textarea id="pc-${m.id}" rows="3">${esc(p && p.c)}</textarea></label>
        ${p ? `<div class="callout fade" role="status">${ic('heart')}<p>Thanks${nm()}. ${p.v === 3 ? 'We will look at this lesson first. You can also ask your buddy about anything that was unclear.' : 'Noted.'}</p></div>` : ''}`;
    }
  };

  function rateRow(set, b) {
    const v = S[set][b.id];
    return `<div class="rate-row">${ic(b.icon)}<span id="${set}-${b.id}">${b.label}</span>
      <div class="scale" role="radiogroup" aria-labelledby="${set}-${b.id}" data-set="${set}" data-b="${b.id}">
      ${[1, 2, 3, 4, 5].map(n => `<button role="radio" aria-checked="${v === n}" tabindex="${(v ? v === n : n === 1) ? 0 : -1}" data-n="${n}" aria-label="${n} of 5">${n}</button>`).join('')}</div></div>`;
  }

  /* Quiz: one question at a time, Submit, feedback layer, results */
  function renderQuiz(s) {
    const a = qa(s), n = s.items.length, cur = quizCur(s), first = quizFirst(s);
    const xpHere = Object.entries(S.got).filter(([k]) => k.startsWith(s.id + ':')).reduce((t, [, v]) => t + v, 0);
    const dots = `<span class="qdots" aria-hidden="true">${s.items.map((q, i) => `<i class="${a[i] != null ? (a[i] === q.a ? 'ok' : 'no') : i === cur ? 'cur' : ''}"></i>`).join('')}</span>`;
    const stats = `<span class="stats"><span class="stat flame ${S.streak >= 3 ? 'hot' : ''}" title="Current streak">${ic('flame')} ${S.streak}</span><span class="stat pts">${ic('zap')} ${xpHere} XP</span></span>`;
    if (cur >= n && quizAllAnswered(s)) {
      const sc = quizScore(s), pct = Math.round(sc / n * 100), stars = quizStars(s);
      const pass = !s.pass || sc >= s.pass;
      return head(s) + `<div class="qcard"><div class="result fade" role="status" tabindex="-1">
        <span class="eyebrow">${s.final ? (pass ? 'Challenge passed' : 'Not passed yet') : 'Check complete'}</span>
        <div class="score-ring" style="--p:${pct}"><div><b>${sc}/${n}</b><small>${pct}%</small></div></div>
        ${starsHTML(stars)}
        <p class="muted">${stars === 3 ? 'Perfect on the first try.' : sc === n ? 'All correct after a retake.' : stars === 2 ? 'Solid. Review the ones you missed below.' : 'Worth another look at the lesson.'} You earned <b>${xpHere} XP</b> here${S.best >= 3 ? ` and your best streak is ${S.best}` : ''}.</p>
        ${s.final && !pass ? `<p>You need ${s.pass} to pass. Retake only the questions you missed; your correct answers are kept.</p><button class="btn accent" data-retake>${ic('rotate')} Retake missed questions</button>` : ''}
        <ul class="review">${s.items.map((q, i) => `<li>${ic(a[i] === q.a ? 'check-circle' : 'x-circle', a[i] === q.a ? 'ok' : 'no')}<span>${q.q}${first[i] === false && a[i] === q.a ? ' <span class="small muted">(on retake)</span>' : ''}</span></li>`).join('')}</ul>
      </div></div>`;
    }
    const q = s.items[cur], ans = a[cur], sel = ans != null ? ans : S.a[s.id + ':sel'];
    const right = ans === q.a;
    const lastQ = s.items.every((_, i) => i === cur || a[i] != null);
    const gained = S.got[`${s.id}:${cur}:${tries(s)}`];
    return head(s) + `<div class="quiz-top"><span class="mono-lab">Question ${cur + 1} of ${n}</span>${dots}${stats}</div>
      <div class="qcard"><div class="qhead"><h2 id="qq">${q.q}</h2></div>
      <div class="qbody" role="radiogroup" aria-labelledby="qq">${q.opts.map((o, j) => {
        let cls = ''; if (ans != null) cls = j === q.a ? 'correct' : j === ans ? 'wrong' : '';
        const mk = ans != null && j === q.a ? `<span class="mk">${ic('check')} Best answer</span>` : ans != null && j === ans ? `<span class="mk">${ic('x')} Your answer</span>` : '';
        return `<button class="opt ${cls}" role="radio" aria-checked="${sel === j}" data-opt="${j}" ${ans != null ? 'disabled' : ''} tabindex="${(sel != null ? sel === j : j === 0) ? 0 : -1}"><span class="lt">${'ABCD'[j]}</span><span>${o}</span>${mk}</button>`;
      }).join('')}</div>
      ${ans == null ? `<div class="qfoot"><button class="btn accent" data-submit ${sel == null ? 'disabled' : ''}>Submit ${ic('arrow-right')}</button></div>`
        : `<div class="fb ${right ? 'ok' : 'no'} fade" role="status" tabindex="-1" id="fb">${ic(right ? 'check-circle' : 'x-circle')}<div><b>${right ? 'Correct' : 'Not quite'}${gained ? `<span class="xp">+${gained} XP</span>` : ''}${right && S.streak >= 2 ? `<span class="xp" style="background:var(--vino);color:var(--on-accent)">${S.streak} in a row</span>` : ''}</b><p>${q.f[ans]}${right ? '' : ` ${q.f[q.a]}`}</p></div>
          <div class="acts"><button class="btn" data-nextq>${lastQ ? 'See results' : 'Next question'} ${ic('arrow-right')}</button></div></div>`}
      </div>`;
  }

  /* ---------- Binders ---------- */
  const rerender = () => renderLesson(false);
  const focusSel = (sel, scroll) => { if (layerOpen) return; const el = $(sel); if (!el) return; el.focus({ preventScroll: true }); if (scroll) el.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }); };
  function bindGeneric(s) {
    const id = s.id;
    $$('.scale').forEach(g => {
      const btns = [...g.querySelectorAll('button')], set = g.dataset.set;
      const choose = (n, f) => { S[set][g.dataset.b] = n; save(); btns.forEach(x => { const on = +x.dataset.n === n; x.setAttribute('aria-checked', on); x.tabIndex = on ? 0 : -1; }); if (f) btns[n - 1].focus(); updateNav(); };
      btns.forEach(x => {
        x.onclick = () => choose(+x.dataset.n);
        x.onkeydown = e => { const n = +x.dataset.n; if (['ArrowRight', 'ArrowUp'].includes(e.key)) { e.preventDefault(); choose(Math.min(5, n + 1), true); } if (['ArrowLeft', 'ArrowDown'].includes(e.key)) { e.preventDefault(); choose(Math.max(1, n - 1), true); } };
      });
    });
    $$('[data-card]').forEach(b => b.onclick = () => {
      const i = +b.dataset.card, o = S.a[id] || [], f = S.a[id + ':f'] || [];
      if (!o.includes(i)) o.push(i);
      S.a[id] = o; S.a[id + ':f'] = f.includes(i) ? f.filter(x => x !== i) : [...f, i]; save();
      const on = S.a[id + ':f'].includes(i); b.setAttribute('aria-pressed', on);
      b.setAttribute('aria-label', `${s.cards[i].h}${on ? ', showing examples' : ', select to see examples'}`);
      b.querySelector('.hintline').innerHTML = `${ic('rotate')} Turn ${on ? 'back' : 'over'}`;
      $('.counter').textContent = `${o.length} of ${s.cards.length} cards turned`; updateNav();
    });
    const tabs = $$('[data-tab]');
    if (tabs.length) {
      if (!S.a[id]) { S.a[id] = [0]; save(); }
      const pick = i => { const o = S.a[id]; if (!o.includes(i)) o.push(i); S.a[id + ':t'] = i; save(); rerender(); focusSel(`[data-tab="${i}"]`); };
      tabs.forEach((t, i) => { t.onclick = () => pick(i); t.onkeydown = e => { if (e.key === 'ArrowRight') { e.preventDefault(); pick((i + 1) % tabs.length); } if (e.key === 'ArrowLeft') { e.preventDefault(); pick((i + tabs.length - 1) % tabs.length); } }; });
      $$('[data-step]').forEach(b => b.onclick = () => pick(+b.dataset.step));
    }
    $$('[data-pick]').forEach(b => b.onclick = () => {
      if (S.a[id] != null) return;
      const i = +b.dataset.pick; S.a[id] = i;
      if (S.a[id + ':first'] == null) {
        S.a[id + ':first'] = i;
        if (s.type === 'predict' && i === s.a) award(id, 50, 'Good guess');
        if (s.type === 'scenario' && s.opts[i].tone === 'good') award(id, 100, 'Best choice');
      }
      save(); rerender(); focusSel('[role="status"]', true);
    });
    const rt = $('[data-retry]'); if (rt) rt.onclick = () => { delete S.a[id]; save(); rerender(); focusSel('[data-pick]'); };
    if (s.type === 'mcq') bindQuiz(s);
    $$('[data-m]').forEach(sel => sel.onchange = () => {
      const a = S.a[id] || { sel: {}, checked: false, first: null };
      if (sel.value === '') delete a.sel[sel.dataset.m]; else a.sel[sel.dataset.m] = +sel.value;
      a.checked = false; S.a[id] = a; save(); rerender(); focusSel('#' + sel.id);
    });
    const ck = $('[data-check]'); if (ck) ck.onclick = () => {
      const a = S.a[id]; a.checked = true;
      if (a.first == null) {
        a.first = s.items.filter((it, i) => a.sel[i] === it.a).length;
        award(id, a.first * 50, `${a.first} of ${s.items.length} correct`);
      }
      save(); rerender(); focusSel('[data-check]');
      if (s.badge && s.items.every((it, i) => a.sel[i] === it.a)) badge(s.badge);
    };
    $$('[data-s]').forEach(b => b.onclick = () => {
      const a = S.a[id] || {}; const i = +b.dataset.s; if (a[i] != null) return;
      a[i] = +b.dataset.o; S.a[id] = a;
      if (a[i] === s.items[i].a) award(`${id}:${i}`, 50, 'Sorted');
      save(); rerender(); const nx = $(`[data-s="${i + 1}"]`); if (nx) nx.focus(); else focusSel('.counter');
    });
    $$('[data-hs]').forEach(b => b.onclick = () => {
      const a = S.a[id] || { hit: [], ok: [], revealed: false, done: false };
      const k = b.dataset.hs, p = s.parts[k];
      if (p.flag) {
        if (!a.hit.includes(k)) { a.hit.push(k); if (!a.revealed) award(`${id}:${k}`, 50, 'Red flag found'); }
        a.lastOk = null;
        const flags = Object.keys(s.parts).filter(x => s.parts[x].flag);
        if (!a.revealed && flags.every(x => a.hit.includes(x))) { S.a[id] = a; save(); badge('phish'); }
      } else { if (!a.ok.includes(k)) a.ok.push(k); a.lastOk = k; }
      S.a[id] = a; save(); rerender(); focusSel(`[data-hs="${k}"]`);
    });
    const rv = $('[data-reveal]'); if (rv) rv.onclick = () => { const a = S.a[id] || { hit: [], ok: [], revealed: false, done: false }; a.revealed = true; S.a[id] = a; save(); rerender(); focusSel('[data-report]'); };
    const rp = $('[data-report]'); if (rp) rp.onclick = () => { S.a[id].done = true; save(); rerender(); };
    $$('[data-ck]').forEach(c => c.onchange = () => {
      let a = S.a[id] || []; const i = +c.dataset.ck;
      a = c.checked ? [...new Set([...a, i])] : a.filter(x => x !== i); S.a[id] = a; save();
      const cnt = $('.counter'); if (cnt) cnt.textContent = `${a.length} of ${val(s.items).length} done · you can continue anytime`;
    });
    $$('[data-pulse]').forEach(b => b.onclick = () => {
      const m = MODULES[s.mi].id; S.pulse[m] = { v: +b.dataset.pulse, c: ($('#pc-' + m) || {}).value || '' }; save();
      award('pulse:' + m, 20, 'Thanks for the feedback');
      if (m === 'm5') badge('ready');
      rerender(); focusSel(`[data-pulse="${b.dataset.pulse}"]`);
    });
    const pc = $('[id^="pc-"]'); if (pc) pc.oninput = () => { const m = MODULES[s.mi].id; if (S.pulse[m]) { S.pulse[m].c = pc.value; save(); } };
  }
  function bindQuiz(s) {
    const id = s.id;
    const opts = $$('[data-opt]');
    const choose = (j, f) => { S.a[id + ':sel'] = j; save(); opts.forEach(o => { const on = +o.dataset.opt === j; o.setAttribute('aria-checked', on); o.tabIndex = on ? 0 : -1; }); const sb = $('[data-submit]'); if (sb) sb.disabled = false; if (f) opts[j].focus(); };
    opts.forEach((o, j) => {
      o.onclick = () => choose(j);
      o.onkeydown = e => { if (['ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); choose((j + 1) % opts.length, true); } if (['ArrowUp', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); choose((j + opts.length - 1) % opts.length, true); } };
    });
    const sb = $('[data-submit]'); if (sb) sb.onclick = () => {
      const cur = quizCur(s), sel = S.a[id + ':sel']; if (sel == null) return;
      const a = qa(s); a[cur] = sel; S.a[id] = a; S.a[id + ':sel'] = null;
      const right = sel === s.items[cur].a, first = quizFirst(s);
      if (first[cur] == null) { first[cur] = right; S.a[id + ':first'] = first; }
      if (right) {
        S.streak++; S.best = Math.max(S.best, S.streak);
        const t = tries(s), base = s.final ? (t > 1 ? 50 : 150) : 100, bonus = S.streak >= 2 ? 25 * Math.min(S.streak - 1, 4) : 0;
        save();
        award(`${id}:${cur}:${t}`, base + bonus, bonus ? `Streak bonus +${bonus}` : 'Correct');
        if (S.streak >= 5) badge('streak');
      } else { S.streak = 0; save(); }
      rerender(); focusSel('#fb', true);
    };
    const nx = $('[data-nextq]'); if (nx) nx.onclick = () => {
      const a = qa(s), cur = quizCur(s);
      let next = s.items.findIndex((_, i) => i > cur && a[i] == null);
      if (next < 0) next = s.items.findIndex((_, i) => a[i] == null);
      S.a[id + ':cur'] = next < 0 ? s.items.length : next; save();
      renderLesson(false); focusSel(next < 0 ? '.result' : '#qq');
      if (next < 0) quizComplete(s);
    };
    const rk = $('[data-retake]'); if (rk) rk.onclick = () => {
      const a = qa(s); s.items.forEach((q, i) => { if (a[i] !== q.a) delete a[i]; });
      S.a[id + ':tries'] = tries(s) + 1; S.a[id + ':cur'] = s.items.findIndex((_, i) => a[i] == null); S.a[id + ':sel'] = null; save();
      renderLesson(true);
    };
  }
  function quizComplete(s) {
    if (s.badge) badge(s.badge);
    if (s.final && quizScore(s) >= s.pass) { badge('certified'); if (tries(s) === 1) badge('firsttry'); }
  }

  /* ---------- Custom screens ---------- */
  const CUSTOM = {
    outcome: {
      gate: () => true,
      render: () => `<div class="head"><h1>Your first 60 days matter to you, and to us.</h1>
        <p class="lead">We redesigned onboarding because the old version didn't work. Here is the problem this course exists to solve.</p></div>
        <div class="gap">
          <div><span class="top-l"><span class="mono-lab">What is happening</span>${ic('clock')}</span><span class="num">120 days</span><p class="small muted">before a new hire feels fully effective</p></div>
          <div class="target"><span class="top-l"><span class="mono-lab">What should be happening</span>${ic('target')}</span><span class="num">60 days</span><p class="small muted">our target for every new colleague</p></div>
          <div><span class="top-l"><span class="mono-lab">What is happening</span>${ic('users')}</span><span class="num">18%</span><p class="small muted">of new hires leave within their first year</p></div>
          <div class="target"><span class="top-l"><span class="mono-lab">What should be happening</span>${ic('trending-up')}</span><span class="num">10%</span><p class="small muted">target by the end of 2027</p></div>
        </div>
        <p class="footnote">Fictional figures for demonstration.</p>

        const byB = BEHAVIORS.map(b => { const its = fin.items.map((q, i) => [q, i]).filter(([q]) => q.b === b.id); return `${its.filter(([q, i]) => qa(fin)[i] === q.a).length}/${its.length}`; });

  function draft() {
    const low = BEHAVIORS.filter(b => S.base[b.id]).sort((x, y) => S.base[x.id] - S.base[y.id]).slice(0, 2);
    const lines = [`First 1:1 with my manager · 25 minutes`, ``, `1. What does a great first 60 days look like in ${dept().n}?`, `2. Which two priorities matter most this month?`];
    low.forEach((b, i) => lines.push(`${i + 3}. I'd like support with: ${b.label.toLowerCase()}`));
    lines.push(`${low.length + 3}. ${S.mode === 'remote' ? 'How do we stay in touch day to day while I am remote?' : 'Which days is the team usually together?'}`);
    lines.push(``, `My plan: week 1 / day 30 / day 60 attached.`);
    return lines.join('\n');
  }

  /* ---------- Shell ---------- */
  let enteredAt = Date.now();

    const now = Date.now();
    if (S.started && document.visibilityState === 'visible') {

  const pctDone = () => Math.round((S.done ? FLAT.length : S.idx) / FLAT.length * 100);

            <div>${ic('smile')}<span><b>Tell us how it feels</b>One tap at the end of each lesson helps us improve the course.</span></div>
            <div>${ic('clipboard-check')}<span><b>Leave with a plan</b>You finish with a 60-day plan to share with your manager.</span></div>

  function renderSide() {
    const cur = FLAT[S.idx], pct = pctDone();

  function updateNav() {

      renderXP(); return;
    }
    document.body.classList.remove('cover-on'); coverEl.hidden = true; coverEl.innerHTML = ''; $('.content').hidden = false;
    const s = FLAT[S.idx], m = MODULES[s.mi];
    const body = s.type === 'custom' ? CUSTOM[s.key].render() : R[s.type](s);
    const L = $('#lesson'), y = window.scrollY;
    const first = FLAT.findIndex(x => x.mi === s.mi);
    L.innerHTML = `<div class="lhead"><span class="tile">${ic(m.icon)}</span><span><small>${lessonLabel(s.mi)}</small><b>${m.name}</b></span>
      <span class="steps" role="img" aria-label="Screen ${s.si + 1} of ${m.screens.length}">${m.screens.map((_, i) => `<i class="${i === s.si ? 'c' : first + i <= S.max ? 'd' : ''}"></i>`).join('')}</span></div>${body}`;
    if (focus) { L.classList.remove('fade'); void L.offsetWidth; L.classList.add('fade'); }
    if (s.type === 'custom') CUSTOM[s.key].bind(); else bindGeneric(s);
    renderSide(); renderLens(); updateNav(); renderXP();
    if (focus) { L.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } else window.scrollTo({ top: y });
  }
  function go(i) {
    if (i < 0) { addTime(); S.started = false; save(); renderLesson(); window.scrollTo({ top: 0 }); return; }
    if (i >= FLAT.length) return;
    addTime(); S.idx = i; S.max = Math.max(S.max, i); save(); renderLesson();
  }
  const coverEl = document.createElement('div'); coverEl.id = 'cover'; coverEl.hidden = true;
  $('.main').insertBefore(coverEl, $('.chain-scroll'));

  $('#back').onclick = () => go(S.idx - 1);
  $('#next').onclick = () => {
    const s = FLAT[S.idx]; if (!gate(s)) return;
    if (S.idx === FLAT.length - 1) {
      addTime(); S.done = true; S.finishedAt = Date.now(); save();
      award('complete', 250, 'Course complete');
      renderLesson(false);
      const c = $('#cert'); if (c) { c.focus({ preventScroll: true }); c.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); }
      return;
    }
    go(S.idx + 1);
  };
  /* Restart: always confirmed in a dialog first */
  function confirmRestart() {
    openLayer(`<div class="dialog center" role="dialog" aria-modal="true" aria-labelledby="rs-t" aria-describedby="rs-d">
      <span class="icon-big">${ic('rotate')}</span>
      <h2 id="rs-t">Restart the course?</h2>
      <p class="muted" id="rs-d">This clears your progress, answers, plan, points and badges, and takes you back to the cover. It can't be undone.</p>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-close>Cancel</button><button class="btn accent" id="rs-ok">${ic('rotate')} Restart course</button></div></div>`, '[data-close]');
    $('#rs-ok').onclick = restart;
  }
  function restart() {
    layerQueue.length = 0; layerReturn = null; closeLayer(); closeMenu();
    S = fresh(); save(); enteredAt = Date.now(); renderLesson(); window.scrollTo({ top: 0 });
    toast(`${ic('rotate')}<span>Course restarted</span>`);
    focusSel('#start');
  }
  $('#reset').onclick = confirmRestart;
  const rsBtn = $('#t-restart'); rsBtn.innerHTML = `${ic('rotate')}<span class="lbl-long">Restart</span>`; rsBtn.onclick = confirmRestart;
  $('#t-xp').onclick = achievementsDialog;

  /* Menu drawer */
  const menuBtn = $('#t-menu'); menuBtn.innerHTML = ic('menu');
  function closeMenu() { document.body.classList.remove('menu'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.onclick = () => { const o = !document.body.classList.contains('menu'); document.body.classList.toggle('menu', o); menuBtn.setAttribute('aria-expanded', o); if (o) { const b = $('.lessons li.current .lsn') || $('.lsn'); if (b) b.focus(); } };
  $('#scrim').onclick = closeMenu;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu')) { closeMenu(); menuBtn.focus(); } });

  /* Preferences */
  let prefs = { lens: false, large: false };
  try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(KEY + '-prefs') || '{}')); } catch (e) {}
  const applyPrefs = () => {
    document.body.classList.toggle('lens', prefs.lens); $('#t-lens').setAttribute('aria-pressed', prefs.lens);
    document.documentElement.classList.toggle('large', prefs.large); $('#t-size').setAttribute('aria-pressed', prefs.large);
    try { localStorage.setItem(KEY + '-prefs', JSON.stringify(prefs)); } catch (e) {}
  };
  $('#t-lens').onclick = () => { prefs.lens = !prefs.lens; applyPrefs(); if (S.started) renderSide(); };
  $('#t-size').onclick = () => { prefs.large = !prefs.large; applyPrefs(); };
  applyPrefs();
  renderLesson(false);
})();
</script>
</body>
</html>
